<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gachapon Master Pro - Miguel Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .retro-font {
            font-family: 'Press Start 2P', cursive;
        }

        .machine-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            height: 95vh;
            background: #1e293b;
            border: 10px solid #334155;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 80px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.1);
        }

        .glass-area {
            position: relative;
            flex-grow: 1;
            background: linear-gradient(180deg, #0f172a 0%, #1e3a8a 100%);
            margin: 15px;
            border-radius: 15px;
            overflow: hidden;
            border: 5px solid #000;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .control-panel {
            height: 200px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            margin: 0 15px 15px 15px;
            border-radius: 15px;
            border: 5px solid #7f1d1d;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px;
            position: relative;
        }

        .btn-drop {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fbbf24 0%, #d97706 100%);
            border-radius: 50%;
            border: 6px solid #b45309;
            color: #451a03;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 0 #92400e, 0 10px 20px rgba(0,0,0,0.4);
            user-select: none;
            transition: all 0.1s;
        }

        .btn-drop:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #92400e;
        }

        .prize-chute {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 110px;
            height: 100px;
            background: #020617;
            border-top-right-radius: 30px;
            border-right: 6px solid #334155;
            border-top: 6px solid #334155;
            box-shadow: inset -10px 10px 20px rgba(0,0,0,0.8);
        }

        .stats-overlay {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 50;
        }

        .stat-badge {
            background: rgba(0,0,0,0.8);
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #4ade80;
            color: #4ade80;
            font-size: 10px;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }

        #coins-display {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #fbbf24;
            z-index: 200;
            display: none;
            text-align: center;
            min-width: 200px;
        }

        #shake-container {
            width: 100%;
            height: 100%;
        }

        .shaking {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 1px, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, -2px, 0); }
            40%, 60% { transform: translate3d(4px, 2px, 0); }
        }
    </style>
</head>
<body>

<div class="machine-container mt-2">
    <div id="shake-container" class="glass-area">
        <div class="stats-overlay">
            <button id="audio-toggle" class="retro-font stat-badge" style="pointer-events: auto;">🔇 SONIDO</button>
            <div class="flex gap-2">
                <div id="coins-display" class="retro-font stat-badge">🪙 MONEDAS: 10</div>
                <div id="score-display" class="retro-font stat-badge">🏆 PREMIOS: 0</div>
            </div>
        </div>

        <div id="status-msg" class="message-box retro-font text-white">
            <div id="msg-title" class="text-yellow-400 mb-2">¡EXCELENTE!</div>
            <div id="msg-body" class="text-xs">¡GANASTE UN PELUCHE!</div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        <div class="prize-chute"></div>
    </div>

    <div class="control-panel">
        <div class="flex flex-col items-center">
            <span class="retro-font mb-3 text-[10px] opacity-70">CONTROL</span>
            <div class="flex gap-4">
                <button id="moveLeft" class="bg-gray-900 p-5 rounded-xl border-b-6 border-black active:border-b-0 active:translate-y-1 transition-all shadow-lg">
                    <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                </button>
                <button id="moveRight" class="bg-gray-900 p-5 rounded-xl border-b-6 border-black active:border-b-0 active:translate-y-1 transition-all shadow-lg">
                    <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12l-4.58-4.59L10 6l6 6-6 6-1.41-1.41z"/></svg>
                </button>
            </div>
        </div>

        <button id="dropBtn" class="btn-drop retro-font text-xs flex flex-col gap-1">
            <span>BAJAR</span>
            <span class="text-[8px] opacity-80">(1 🪙)</span>
        </button>
        
        <div class="hidden sm:flex flex-col items-center gap-1 opacity-50">
            <div class="retro-font text-[10px]">MIGUEL</div>
            <div class="retro-font text-[8px]">ARCADE 2.0</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const coinsDisplay = document.getElementById('coins-display');
    const statusMsg = document.getElementById('status-msg');
    const msgTitle = document.getElementById('msg-title');
    const msgBody = document.getElementById('msg-body');
    const shakeContainer = document.getElementById('shake-container');
    const audioToggle = document.getElementById('audio-toggle');

    // Estado Global
    let audioCtx = null;
    let audioEnabled = false;
    let score = 0;
    let coins = 10;
    let width, height;
    let state = 'IDLE'; 
    let particles = [];
    
    const claw = {
        x: 150,
        y: 60,
        width: 60,
        height: 40,
        open: 1,
        speed: 4,
        color: '#f8fafc',
        heldPrize: null
    };

    const emojis = ['🧸', '🐼', '🐰', '🐱', '🐶', '🦊', '🦁', '🐯', '🦄', '🐲', '🦖', '🐙'];
    let prizes = [];

    // --- AUDIO ---
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, type, duration, volume = 0.1) {
        if (!audioEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // --- LÓGICA DE JUEGO ---

    // Función de inicialización corregida
    function init() {
        resize();
        spawnPrizes();
        requestAnimationFrame(gameLoop);
    }

    class Prize {
        constructor(isNew = false) {
            this.init(isNew);
        }

        init(isNew) {
            this.x = 130 + Math.random() * (width - 180);
            this.y = isNew ? -50 : height - 60 - Math.random() * 80;
            this.size = 50 + Math.random() * 10; 
            this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
            this.rotation = (Math.random() - 0.5);
            this.vx = 0;
            this.vy = 0;
            this.isHeld = false;
            this.isGolden = Math.random() < 0.1; 
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            ctx.shadowBlur = this.isGolden ? 25 : 15;
            ctx.shadowColor = this.isGolden ? '#fbbf24' : 'rgba(255,255,255,0.4)';
            
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.strokeStyle = "rgba(0,0,0,0.5)";
            ctx.lineWidth = 4;
            ctx.strokeText(this.emoji, 0, 0);
            
            ctx.fillText(this.emoji, 0, 0);
            
            if (this.isGolden) {
                ctx.font = 'bold 12px sans-serif';
                ctx.fillStyle = '#fff';
                ctx.fillText('✨', 15, -15);
            }
            
            ctx.restore();
        }

        update() {
            if (this.isHeld) {
                this.x = claw.x;
                this.y = claw.y + 45;
                this.rotation = Math.sin(Date.now() / 150) * 0.15;
                return;
            }

            if (this.y < height - 60) {
                this.vy += 0.4;
                this.y += this.vy;
                this.x += this.vx;
            } else {
                this.y = height - 60;
                this.vy *= -0.3; 
                this.vx *= 0.9;
            }

            if (this.x < 120 && this.y > height - 100) {
                 // Caída en el conducto
            } else {
                if (this.x < 30) this.x = 30;
            }
            if (this.x > width - 30) this.x = width - 30;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.life = 1.0;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.2;
            this.life -= 0.02;
        }
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<20; i++) particles.push(new Particle(x, y, color));
    }

    function triggerShake() {
        shakeContainer.classList.add('shaking');
        setTimeout(() => shakeContainer.classList.remove('shaking'), 300);
        playTone(60, 'triangle', 0.2, 0.3);
    }

    function spawnPrizes() {
        prizes = [];
        for (let i = 0; i < 18; i++) prizes.push(new Prize());
    }

    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        width = canvas.width = rect.width;
        height = canvas.height = rect.height;
    }

    function drawClaw() {
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 3]);
        ctx.beginPath();
        ctx.moveTo(claw.x, 0);
        ctx.lineTo(claw.x, claw.y);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#475569';
        ctx.fillRect(claw.x - 30, 0, 60, 20);

        const ledColor = state === 'GRABBING' ? '#ef4444' : (claw.heldPrize ? '#4ade80' : '#3b82f6');
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(claw.x - 25, claw.y - 15, 50, 25, 10);
        ctx.fill();
        
        ctx.fillStyle = ledColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = ledColor;
        ctx.beginPath();
        ctx.arc(claw.x, claw.y - 3, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        const angle = 0.1 + (claw.open * 0.9);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';

        ctx.save();
        ctx.translate(claw.x - 18, claw.y + 10);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-20, 40);
        ctx.lineTo(-5, 60);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(claw.x + 18, claw.y + 10);
        ctx.rotate(-angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(20, 40);
        ctx.lineTo(5, 60);
        ctx.stroke();
        ctx.restore();
    }

    function showMessage(title, body) {
        msgTitle.innerText = title;
        msgBody.innerText = body;
        statusMsg.style.display = 'block';
        setTimeout(() => statusMsg.style.display = 'none', 2500);
    }

    function update() {
        prizes.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => p.update());

        switch(state) {
            case 'MOVING_LEFT':
                if (claw.x > 40) claw.x -= claw.speed;
                if (Math.random() > 0.9) playTone(200, 'square', 0.05, 0.01);
                break;
            case 'MOVING_RIGHT':
                if (claw.x < width - 40) claw.x += claw.speed;
                if (Math.random() > 0.9) playTone(200, 'square', 0.05, 0.01);
                break;
            case 'DROPPING':
                claw.open = Math.min(1, claw.open + 0.1);
                if (claw.y < height - 120) {
                    claw.y += claw.speed * 2;
                } else {
                    triggerShake();
                    state = 'GRABBING';
                }
                break;
            case 'GRABBING':
                claw.open = Math.max(0.1, claw.open - 0.04);
                if (claw.open <= 0.1) {
                    let caught = null;
                    prizes.forEach(p => {
                        const dx = p.x - claw.x;
                        const dy = p.y - (claw.y + 50);
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 50 && !caught) {
                            if (Math.random() < 0.45) caught = p;
                        }
                    });

                    if (caught) {
                        claw.heldPrize = caught;
                        caught.isHeld = true;
                        playTone(400, 'sine', 0.3, 0.1);
                    }
                    state = 'LIFTING';
                }
                break;
            case 'LIFTING':
                if (claw.y > 60) {
                    claw.y -= claw.speed;
                    if (claw.heldPrize && Math.random() < 0.004 && claw.y > 180) {
                        claw.heldPrize.isHeld = false;
                        claw.heldPrize.vy = 2;
                        claw.heldPrize = null;
                        claw.open = 0.5;
                        playTone(150, 'sawtooth', 0.4, 0.1);
                    }
                } else {
                    state = 'RETURNING';
                }
                break;
            case 'RETURNING':
                if (claw.x > 55) {
                    claw.x -= claw.speed;
                } else {
                    state = 'RELEASING';
                }
                break;
            case 'RELEASING':
                claw.open = Math.min(1, claw.open + 0.08);
                if (claw.open >= 1) {
                    if (claw.heldPrize) {
                        claw.heldPrize.isHeld = false;
                        claw.heldPrize.vy = 4;
                        
                        if (claw.x < 115) {
                            const val = claw.heldPrize.isGolden ? 2 : 1;
                            score += val;
                            coins += 2; 
                            
                            scoreDisplay.innerText = `🏆 PREMIOS: ${score}`;
                            coinsDisplay.innerText = `🪙 MONEDAS: ${coins}`;
                            
                            createExplosion(claw.x, claw.y + 60, claw.heldPrize.isGolden ? '#fbbf24' : '#4ade80');
                            
                            if (claw.heldPrize.isGolden) {
                                showMessage("¡ORO PURO!", "Ganaste un premio especial y +2 🪙");
                                playTone(880, 'sine', 0.6, 0.1);
                            } else {
                                showMessage("¡CONSEGUIDO!", "Peluche atrapado y +2 🪙");
                                playTone(523, 'sine', 0.4, 0.1);
                            }
                            
                            const p = claw.heldPrize;
                            setTimeout(() => p.init(true), 2000);
                        } else {
                            playTone(100, 'sawtooth', 0.3, 0.1);
                        }
                        claw.heldPrize = null;
                    }
                    state = 'IDLE';
                }
                break;
        }
    }

    function gameLoop() {
        ctx.clearRect(0, 0, width, height);
        prizes.forEach(p => p.draw());
        particles.forEach(p => p.update() || p.draw());
        drawClaw();
        update();
        requestAnimationFrame(gameLoop);
    }

    // --- CONTROLES ---
    audioToggle.onclick = () => {
        initAudio();
        audioEnabled = !audioEnabled;
        audioToggle.innerText = audioEnabled ? "🔊 SONIDO: ON" : "🔇 SONIDO: OFF";
        audioToggle.style.borderColor = audioEnabled ? "#4ade80" : "#f87171";
        audioToggle.style.color = audioEnabled ? "#4ade80" : "#f87171";
    };

    const btnLeft = document.getElementById('moveLeft');
    const btnRight = document.getElementById('moveRight');
    const btnDrop = document.getElementById('dropBtn');

    const handleLeft = (e) => { e.preventDefault(); if (state === 'IDLE') state = 'MOVING_LEFT'; };
    const handleRight = (e) => { e.preventDefault(); if (state === 'IDLE') state = 'MOVING_RIGHT'; };
    const handleStop = () => { if (state === 'MOVING_LEFT' || state === 'MOVING_RIGHT') state = 'IDLE'; };

    btnLeft.onmousedown = btnLeft.ontouchstart = handleLeft;
    btnLeft.onmouseup = btnLeft.ontouchend = handleStop;
    btnRight.onmousedown = btnRight.ontouchstart = handleRight;
    btnRight.onmouseup = btnRight.ontouchend = handleStop;

    btnDrop.onclick = () => {
        if (state === 'IDLE' || state === 'MOVING_LEFT' || state === 'MOVING_RIGHT') {
            if (coins > 0) {
                coins--;
                coinsDisplay.innerText = `🪙 MONEDAS: ${coins}`;
                state = 'DROPPING';
                playTone(300, 'sawtooth', 0.4, 0.05);
            } else {
                showMessage("SIN MONEDAS", "¡Necesitas más créditos!");
                playTone(100, 'sawtooth', 0.5, 0.2);
            }
        }
    };

    window.addEventListener('resize', resize);
    window.onload = () => {
        init();
        setTimeout(() => showMessage("¡HOLA MIGUEL!", "Usa las flechas y atrapa peluches"), 500);
    };
</script>
</body>
</html>
